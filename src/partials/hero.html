<section class="hero" aria-labelledby="hero-title">
  <div class="hero-bg" aria-hidden="true"><div class="wrap hero-guides"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>
  <div class="wrap hero-inner">
    <p class="hero-roles reveal-hero">{{#each t.hero.roles}}<span>{{this}}</span>{{/each}}</p>
    <h1 class="hero-name" id="hero-title"><span class="hero-line"><span class="hero-word">{{nameParts.first}}</span></span> <span class="hero-line hero-line-2"><span class="hero-word">{{nameParts.last}}<span class="hero-dot" aria-hidden="true"></span></span></span></h1>
    <div class="hero-grid">
      <div class="hero-copy reveal-hero">
        <p class="hero-lead">{{t.hero.lead | rich}}</p>
        <p class="hero-intro">{{t.hero.intro}}</p>
        <div class="hero-ctas">
          <a class="btn btn-primary" href="#contact"><span>{{t.hero.ctaPrimary}}</span><svg class="i" aria-hidden="true"><use href="#i-arrow-r"/></svg></a>
          <a class="btn btn-ghost" href="#work"><span>{{t.hero.ctaSecondary}}</span><svg class="i" aria-hidden="true"><use href="#i-arrow-d"/></svg></a>
        </div>
      </div>
      <div class="hero-spec reveal-hero">
        <h2 class="spec-title">{{t.hero.specTitle}}</h2>
        <dl class="spec-list">
          {{#each t.hero.spec}}<div class="spec-row"><dt>{{k}}</dt><dd>{{v}}</dd></div>
          {{/each}}
        </dl>
      </div>
    </div>
    <a class="hero-scroll" href="#capabilities"><span class="hero-scroll-track" aria-hidden="true"><span></span></span><span>{{t.hero.scroll}}</span></a>
  </div>
</section>
