<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#FF6B45" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF6B45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="630">
      <stop offset="0" stop-color="#fff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", "Noto Sans", "Ubuntu Sans", Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: "SF Mono", "Cascadia Mono", "JetBrains Mono", "Noto Sans Mono", "Ubuntu Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace; letter-spacing: .12em; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#121211"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="url(#fade)" stroke-width="1">{{{og.guides}}}</g>
  <g transform="translate(72 64)">
    <rect width="40" height="40" rx="9" fill="#ECE9E2"/>
    <path d="M10 28.1V11.9l6.9 9.4 6.9-9.4v16.2" fill="none" stroke="#121211" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="27.2" y="24.7" width="3.4" height="3.4" fill="#FF6B45"/>
  </g>
  <text class="mono" x="128" y="91" font-size="15" fill="#A9A59C">{{og.host}}</text>
  <text class="sans" x="68" y="300" font-size="146" font-weight="600" letter-spacing="-7" fill="#F4F2ED">{{og.first}}</text>
  <text class="sans" x="68" y="436" font-size="146" font-weight="600" letter-spacing="-7" fill="#F4F2ED">{{og.last}}<tspan fill="#FF6B45">.</tspan></text>
  <line x1="72" y1="506" x2="1128" y2="506" stroke="#F4F2ED" stroke-opacity=".16"/>
  <text class="mono" x="72" y="554" font-size="19" fill="#ECE9E2">{{og.roles}}</text>
</svg>
