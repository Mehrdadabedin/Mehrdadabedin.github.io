<!doctype html>
<html lang="{{lang.htmlLang}}" dir="ltr" data-lang="{{lang.code}}">
<head>
{{> head}}
<title>{{t.meta.title}}</title>
<meta name="description" content="{{t.meta.description}}">
<link rel="canonical" href="{{page.canonical}}">
{{#each alternates}}<link rel="alternate" hreflang="{{hreflang}}" href="{{href}}">
{{/each}}<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{t.meta.ogTitle}}">
<meta property="og:description" content="{{t.meta.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:locale" content="{{lang.ogLocale}}">
{{#each ogAlternateLocales}}<meta property="og:locale:alternate" content="{{this}}">
{{/each}}<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:type" content="{{page.ogImageType}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{t.meta.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{t.meta.ogTitle}}">
<meta name="twitter:description" content="{{t.meta.description}}">
<meta name="twitter:image" content="{{page.ogImage}}">
<meta name="twitter:image:alt" content="{{t.meta.ogImageAlt}}">
<script type="application/ld+json">{{{page.jsonld}}}</script>
<script src="{{assets.js}}" defer></script>
</head>
<body>
{{> sprite}}
<a class="skip" href="#main">{{t.a11y.skip}}</a>
{{> header}}
<main id="main" tabindex="-1">
{{> hero}}
{{> capabilities}}
{{> showcase}}
{{#if hasCerts}}{{> certificates}}{{/if}}
{{> security}}
{{> approach}}
{{> contact}}
</main>
{{> footer}}
</body>
</html>
